[project]
name = "sgwa"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2,<3",
  "alembic>=1.14,<2", "pymysql>=1.1,<2", "cryptography>=44",
  "pydantic-settings>=2,<3", "pyjwt>=2.10,<3", "argon2-cffi>=23",
  "scikit-learn>=1.6,<2", "joblib>=1.4", "email-validator>=2",
  "python-multipart>=0.0.9"
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28", "pytest-cov>=6"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["backend*", "ml*"]
[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests"]
pythonpath = ["."]
