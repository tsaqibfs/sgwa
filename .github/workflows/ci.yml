name: SGWA checks
on: [push, pull_request]
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: sgwa_ci_only
          MYSQL_DATABASE: sgwa_test_ci
          MYSQL_USER: sgwa_ci
          MYSQL_PASSWORD: sgwa_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysql -h 127.0.0.1 -usgwa_ci -psgwa_ci_only sgwa_test_ci -e 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 24
    env:
      DATABASE_URL: mysql+pymysql://sgwa_ci:sgwa_ci_only@127.0.0.1:3306/sgwa_test_ci
      TEST_DATABASE_URL: mysql+pymysql://sgwa_ci:sgwa_ci_only@127.0.0.1:3306/sgwa_test_ci
      JWT_SECRET: sgwa-ci-only-secret-at-least-32-characters
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: >-
          python -m pytest -ra --cov=backend.app --cov=ml
          --cov-fail-under=90
          --cov-report=term-missing --cov-report=xml:coverage/coverage.xml
          --cov-report=html:coverage/html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    env:
      MYSQL_PASSWORD: sgwa_ci_mysql_only
      MYSQL_ROOT_PASSWORD: sgwa_ci_root_only
      DEMO_PASSWORD: SGWA-CI-Demo-Only-123!
      JWT_SECRET: sgwa-ci-only-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - name: Prepare test certificate
        run: |
          mkdir -p tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' -keyout tls/tls.key -out tls/tls.crt
      - name: Build and start services
        run: docker compose -f compose.docker.yaml -f compose.https.yaml up --build -d --wait --wait-timeout 360
      - name: Check HTTPS, session cookies and authentication rate limit
        run: |
          base=https://127.0.0.1:8443
          curl --fail --cacert tls/tls.crt "$base/api/v1/health"
          token=$(curl --fail --silent --cacert tls/tls.crt -c /tmp/sgwa-ci.cookies "$base/api/v1/auth/csrf" | jq -er '.csrf_token')
          payload=$(jq -nc --arg password "$DEMO_PASSWORD" '{email:"admin@demo.sgwa.id", password:$password}')
          curl --fail --silent --cacert tls/tls.crt -b /tmp/sgwa-ci.cookies -c /tmp/sgwa-ci.cookies -H "Origin: $base" -H "X-CSRF-Token: $token" -H 'Content-Type: application/json' --data "$payload" "$base/api/v1/auth/login" | jq -e '.user.role == "admin"'
          agency=$(curl --fail --silent --cacert tls/tls.crt -b /tmp/sgwa-ci.cookies "$base/api/v1/agencies" | jq -er '.[0].id')
          curl --fail --silent --cacert tls/tls.crt -b /tmp/sgwa-ci.cookies "$base/api/v1/reports/forecast?agency_id=$agency" | jq -e '.status == "insufficient_data"'
          test "$(curl --silent --cacert tls/tls.crt -o /dev/null -w '%{http_code}' "$base/api/v1/live")" = 401
          curl --fail --silent --no-buffer --max-time 5 --cacert tls/tls.crt -b /tmp/sgwa-ci.cookies "$base/api/v1/live" > /tmp/sgwa-ci-sse.txt || test "$?" = 28
          grep -q '^event: changed' /tmp/sgwa-ci-sse.txt
          seen=0
          for attempt in {1..12}; do
            status=$(curl --silent --cacert tls/tls.crt -D /tmp/sgwa-rate.headers -o /tmp/sgwa-rate.json -w '%{http_code}' -X POST "$base/api/v1/auth/login")
            case "$status" in
              403) ;;
              429) grep -qi '^Retry-After: 5' /tmp/sgwa-rate.headers
                   jq -e '.detail' /tmp/sgwa-rate.json
                   seen=1; break ;;
              *) exit 1 ;;
            esac
          done
          test "$seen" = 1
      - name: Docker logs
        if: failure()
        run: docker compose -f compose.docker.yaml -f compose.https.yaml logs --no-color
      - name: Remove disposable CI volumes
        if: always()
        run: docker compose -f compose.docker.yaml -f compose.https.yaml down -v
