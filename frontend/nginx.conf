map "$request_method:$uri" $auth_limit_key {
    default "";
    ~*^POST:/api/v1/auth/(login|register)/?$ $binary_remote_addr;
}

map $request_method $mutation_limit_key {
    default "";
    ~^(POST|PUT|PATCH|DELETE)$ $binary_remote_addr;
}

limit_req_zone $auth_limit_key zone=auth_per_ip:10m rate=12r/m;
limit_req_zone $mutation_limit_key zone=mutations_per_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=live_per_ip:10m;

server {
    listen 80;
    server_name localhost;
    include /etc/nginx/sgwa-site.conf;
}
