root /usr/share/nginx/html;
index index.html;
client_max_body_size 11m;
resolver 127.0.0.11 valid=5s ipv6=off;
limit_req_status 429;
limit_conn_status 429;
error_page 429 = @rate_limited;

location /api/ {
    limit_req zone=auth_per_ip burst=6 nodelay;
    limit_req zone=mutations_per_ip burst=20 nodelay;
    include /etc/nginx/sgwa-api.conf;
}

location = /api/v1/live {
    limit_conn live_per_ip 12;
    include /etc/nginx/sgwa-api.conf;
    proxy_read_timeout 60s;
}

location @rate_limited {
    default_type application/json;
    add_header Retry-After 5 always;
    add_header Cache-Control no-store always;
    return 429 '{"detail":"Terlalu banyak permintaan. Silakan coba kembali dalam beberapa detik."}';
}

location / {
    try_files $uri $uri/ /index.html;
}
