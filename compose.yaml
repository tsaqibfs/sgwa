services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: sgwa
      MYSQL_USER: sgwa
      MYSQL_PASSWORD: sgwa_local_dev
      MYSQL_ROOT_PASSWORD: sgwa_root_local_dev
    volumes:
      - sgwa_mysql:/var/lib/mysql
      - ./database/test-init.sql:/docker-entrypoint-initdb.d/test-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psgwa_root_local_dev"]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  sgwa_mysql:
